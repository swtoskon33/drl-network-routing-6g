[project]
name = "drl-routing"
version = "0.1.0"
description = "Deep reinforcement learning for network routing, benchmarked against Dijkstra."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
rl = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
]
tuning = ["ray[tune]>=2.9"]
tracking = ["mlflow>=2.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["unit", "integration"]

[tool.ruff]
line-length = 100
