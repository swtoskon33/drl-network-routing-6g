name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts

      - name: Tests
        run: python -m pytest -q

  benchmark:
    name: Scheduling benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with the RL extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rl]"

      # A short run: enough to catch a change that breaks training or the baseline,
      # not enough to reproduce the published numbers. Those come from a full run.
      - name: Smoke-run the benchmark
        run: python scripts/benchmark_scheduling.py --sizes small --steps 2000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: docs/scheduling_benchmark.md
